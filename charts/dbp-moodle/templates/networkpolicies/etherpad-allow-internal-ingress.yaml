{{- if and .Values.dbpMoodle.networkPolicies.enabled .Values.etherpadlite.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: etherpad-allow-internal-ingress
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: etherpad
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.dbpMoodle.networkPolicies.ingressNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9001
{{- end }}
