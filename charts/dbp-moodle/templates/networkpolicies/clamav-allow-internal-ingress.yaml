{{- if and .Values.dbpMoodle.networkPolicies.enabled .Values.clamav.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clamav-allow-internal-ingress
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clamav
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3310
{{- end }}
