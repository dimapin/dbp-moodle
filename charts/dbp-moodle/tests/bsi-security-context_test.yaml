# BSI IT-Grundschutz SYS.1.6 — Sichere Containerkonfiguration
#
# Verwandte BSI-Kriterien:
#   SYS.1.6.A6:  Sichere Konfiguration der Container-Infrastruktur
#   SYS.1.6.A15: Privileged-Container-Isolation — kein privileged: true
#   SYS.1.6.A16: Rootless-Container — runAsNonRoot, kein runAsUser: 0
#   SYS.1.6.A18: Seccomp-Profil RuntimeDefault
#   SYS.1.6.A20: Minimale Capabilities — capabilities.drop: [ALL]
#
# Trivy-Mapping (wird durch `trivy config` ergänzend geprüft):
#   KSV010 — Avoid privileged containers         → SYS.1.6.A15
#   KSV001/KSV012 — Avoid running as root        → SYS.1.6.A16
#   KSV002/KSV035 — Drop ALL capabilities        → SYS.1.6.A20
#   KSV025/KSV030 — Seccomp RuntimeDefault       → SYS.1.6.A18

suite: "BSI SYS.1.6.A6/A15/A16/A18/A20 – Sichere Containerkonfiguration"

tests:
  # ── Restore-Job (templates/chart-hooks/moodle-restore-job.yaml) ─────────────
  - it: "restore-job: Container darf nicht privilegiert laufen (SYS.1.6.A15)"
    template: templates/chart-hooks/moodle-restore-job.yaml
    set:
      dbpMoodle.restore.enabled: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false

  - it: "restore-job: Keine Privilege-Eskalation erlaubt (SYS.1.6.A16)"
    template: templates/chart-hooks/moodle-restore-job.yaml
    set:
      dbpMoodle.restore.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: "restore-job: Läuft als Non-Root mit UID/GID 1001 (SYS.1.6.A16)"
    template: templates/chart-hooks/moodle-restore-job.yaml
    set:
      dbpMoodle.restore.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1001

  - it: "restore-job: ALL capabilities werden gedroppt (SYS.1.6.A20)"
    template: templates/chart-hooks/moodle-restore-job.yaml
    set:
      dbpMoodle.restore.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"

  - it: "restore-job: Pod-SecurityContext setzt fsGroup und Seccomp (SYS.1.6.A6/A18)"
    template: templates/chart-hooks/moodle-restore-job.yaml
    set:
      dbpMoodle.restore.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  # ── Update-Preparation-Job (templates/chart-hooks/moodle-update-preparation-job.yaml)
  - it: "update-preparation-job: Container darf nicht privilegiert laufen (SYS.1.6.A15)"
    template: templates/chart-hooks/moodle-update-preparation-job.yaml
    set:
      dbpMoodle.moodleUpdatePreparationJob.enabled: true
      dbpMoodle.restore.enabled: false
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false

  - it: "update-preparation-job: Keine Privilege-Eskalation erlaubt (SYS.1.6.A16)"
    template: templates/chart-hooks/moodle-update-preparation-job.yaml
    set:
      dbpMoodle.moodleUpdatePreparationJob.enabled: true
      dbpMoodle.restore.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: "update-preparation-job: Läuft als Non-Root mit UID/GID 1001 (SYS.1.6.A16)"
    template: templates/chart-hooks/moodle-update-preparation-job.yaml
    set:
      dbpMoodle.moodleUpdatePreparationJob.enabled: true
      dbpMoodle.restore.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1001

  - it: "update-preparation-job: ALL capabilities werden gedroppt (SYS.1.6.A20)"
    template: templates/chart-hooks/moodle-update-preparation-job.yaml
    set:
      dbpMoodle.moodleUpdatePreparationJob.enabled: true
      dbpMoodle.restore.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"

  - it: "update-preparation-job: Pod-SecurityContext setzt fsGroup und Seccomp (SYS.1.6.A6/A18)"
    template: templates/chart-hooks/moodle-update-preparation-job.yaml
    set:
      dbpMoodle.moodleUpdatePreparationJob.enabled: true
      dbpMoodle.restore.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
